apiVersion: apps/v1    # The API version defines the versioned schema of this representation of an object

kind: Deployment  # The Type of Object to create
metadata:
  name: excellent-bookshop # name of the deployment
  labels: # A set of labels attached to the development
    app: excellent-bookshop  # this development is labeled with app=excellent-bookshop
spec:
  selector: # Defines the labels used to select the Pods to be scaled
    matchLabels:
      app: excellent-bookshop
  template: # The Template for creating a Pod
    metadata:
      labels: # Labels attached to the Pod object. Should be match with label above
        app: excellent-bookshop
    spec:
      containers: # The List of containers in the Pod
        - name: excellent-bookshop # name of the pod
          image: excellent-bookshop # image used to run the container
          imagePullPolicy: IfNotPresent # instruct the k8s to pull if not present locally
          lifecycle:
            preStop: # Makes Kubernetes wait 5 seconds before sending the SIGTERM signal to the Pod
              exec:
                command: [ "sh", "-c", "sleep 5" ]
          ports:
            - containerPort: 9001 #port expose by the container
          env: # the list of environment variables passed to the Pod
            - name: BPL_JVM_THREAD_COUNT # A Paketo Buildpacks environment variable to configure the number of threads for memory calculation
              value: "50"
            - name: SPRING_DATASOURCE_URL # A value for the spring.datasource.url property pointing to the PostgreSQL Pod deployed previously
              value: jdbc:postgresql://excellent-postgres/excellentdb_catalog
            - name: SPRING_PROFILES_ACTIVE # enable demo profile with dummyData
              value: demo


