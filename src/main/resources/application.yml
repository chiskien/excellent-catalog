server:
  port: 9001
  tomcat:
    connection-timeout: 2s # define a limit how much time Tomcat should wait between accepting TCP connection from a client and actually received the HTTP Request. Helps prevent denial-of-service (DoS)
    keep-alive-timeout: 15s
    threads:
      max: 50
      min-spare: 5
  shutdown: graceful
#polar:
#  greeting: "Welcome to Catalog Service"
spring:
  application:
    name: excellent-catalog-service
  config:
    import: "optional:configserver:"
  cloud:
    config:
      uri: http://localhost:8888
      request-connect-timeout: 5000
      request-read-timeout: 5000
      retry:
        max-attempts: 6
        initial-interval: 1000
        max-interval: 2000
        multiplier: 1.1
  datasource:
    username: postgres
    password: chiskien
    url: jdbc:postgresql://localhost:5432/excellentdb_catalog
    hikari:
      connection-timeout: 2000
      maximum-pool-size: 5
  lifecycle:
    timeout-per-shutdown-phase: 15s
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/ExcellentBookshop
#  sql:
#    init:
#      mode: always
management:
  endpoints:
    web:
      exposure:
        include: refresh
  endpoint:
    health:
      show-details: always
